<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mis precios</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:#172033;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#172554;color:#fff;padding:11px 13px;box-shadow:0 2px 10px #17255430}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:18px;margin:0}.sub{font-size:11px;color:#cbd5e1}
.layout{max-width:1100px;margin:auto;padding:10px 9px 30px;display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:start}
.sidebar{position:sticky;top:66px;background:#fff;border:1px solid #e0e5ed;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.catbtn{border:0;background:transparent;color:#536078;text-align:left;padding:8px 6px;border-radius:7px;font:700 11px/1.25 system-ui;cursor:pointer;overflow-wrap:anywhere}
.catbtn.active{background:#e8eefc;color:#173b91}
.catcount{display:block;font-size:9px;font-weight:500;opacity:.75;margin-top:2px}
#products{min-width:0}
.card{background:#fff;border:1px solid #e0e5ed;border-radius:12px;overflow:hidden;margin-bottom:11px;box-shadow:0 2px 7px #14213d0b}
.cardhead{padding:9px 11px;display:flex;align-items:center;gap:8px;min-height:43px}
.name{font-weight:750;font-size:14px;min-width:0;overflow-wrap:anywhere}.store{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#687386;font-weight:800}
.open{margin-left:auto;white-space:nowrap;color:#2457d6;text-decoration:none;font-size:11px;font-weight:700}
.framewrap{height:620px;background:#fff;border-top:1px solid #e8ebf0;position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.hint{padding:8px 11px;color:#687386;font-size:11px;background:#fafbfc;border-top:1px solid #edf0f4}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:10px;padding:18px;color:#687386;font-size:12px}
footer{text-align:center;color:#8791a1;font-size:10px;padding:8px 12px 20px}
@media(min-width:700px){.layout{padding:14px}.framewrap{height:720px}.sidebar{top:70px}}
@media(max-width:420px){.layout{grid-template-columns:82px minmax(0,1fr);gap:7px;padding:7px 5px}.sidebar{padding:4px}.catbtn{font-size:10px;padding:7px 4px}.cardhead{padding:8px}.name{font-size:12px}.framewrap{height:570px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Mis precios</h1><div class="sub">Comparador de productos · actualización automática SEPA</div></div><div class="sub" id="refreshStatus">Consultando precios…</div></div></header>
<div class="layout">
 <aside class="sidebar" id="categories" aria-label="Categorías"></aside>
 <main id="products"></main>
</div>
<footer>Si un comercio bloquea la visualización integrada, usá “Abrir ↗” para consultar su página.</footer>
<script>
const categoriesList=["Cerdo","Almacén","Supremas","Limpieza"];
const SEPA_BASE="https://hysmarcos.github.io/superprecios-claros/v1";
const SEPA_REGION="CENTRO";
const products=[
 {category:"Cerdo",name:"Bondiola de cerdo x kg",store:"Coto",url:"https://www.coto.com.ar/productos/bondiola-de-cerdo-x-kg-/_/R-00000943-00000943-200",autoItems:[{name:"Bondiola de cerdo x kg",brand:"Coto",ean:"2000943000004"}]},
 {category:"Cerdo",name:"Bondiola congelada x kg",store:"Carrefour",url:"https://www.carrefour.com.ar/bondiola-congelada-x-kg-691385/p",autoItems:[{name:"Bondiola congelada x kg",brand:"Carrefour",ean:"2506785000009"}]},
 {category:"Cerdo",name:"Nalga de cerdo x kg",store:"Coto",url:"https://www.coto.com.ar/productos/nalga-de-cerdo-x-kg-/_/R-00017705-00017705-200",autoPending:true},
 {category:"Almacén",name:"Pan rallado · presentaciones de 1 kg",store:"Carrefour y otros",url:"https://www.carrefour.com.ar/almacen/harinas/pan-rallado-y-rebozadores",autoItems:[
  {name:"Pan rallado Carrefour Classic 1 kg",brand:"Carrefour",ean:"7798141714803"},
  {name:"Pan rallado Morixe 1 kg",brand:"Morixe",ean:"7790199602927"}
 ]},
 {category:"Supremas",name:"Suprema de pollo congelada · 2 kg",store:"Carrefour",url:"https://www.carrefour.com.ar/suprema-congelada-2-kg-787049/p",autoPending:true},
 {category:"Supremas",name:"Supremas de pollo frescas y congeladas",store:"Coto",url:"https://www.coto.com.ar/categoria/_/N-1ugrnogZ1ozthvgZndoj69?Nf=product.endDate%7CGTEQ+1.7337024E12%7C%7Cproduct.startDate%7CLTEQ+1.7337024E12%7C%7Cproduct.startDate%7CLTEQ+1.693872E12%7C%7Cproduct.endDate%7CGTEQ+1.693872E12&Nr=AND%28product.language%3Aespa%C3%B1ol%2Cproduct.sDisp_200%3A1004%2COR%28product.siteId%3ACotoDigital%29%29&Nrpp=72&Ns=sku.activePrice%7C1%7C%7Cproduct.displayName%7C0&showMoreIds=4291659268",autoPending:true},
 {category:"Limpieza",name:"Jabón líquido Skip para diluir Bio-Enzimas 500 ml",store:"Coto y Carrefour",url:"https://www.coto.com.ar/productos/jabon-liquido-para-diluir-skip-500ml-/_/R-00531047-00531047-200",autoItems:[{name:"Skip Bio-Enzimas para diluir 500 ml",brand:"Skip",ean:"7791290792838",unit:"500 ml"}]}
];
let selectedCategory="Almacén";
let sepaPrices={},refreshMessage="Consultando precios…";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:2});
function allEans(){return [...new Set(products.flatMap(p=>(p.autoItems||[]).map(x=>x.ean)).filter(Boolean))]}
function renderAuto(p){
 if(p.autoPending)return '<div class="hint">Actualización automática pendiente: falta identificar el código de barras exacto para consultar SEPA. No mostramos precios estimados como actuales.</div>';
 return '<div style="padding:8px 11px"><div style="font-size:11px;color:#536078;font-weight:700;margin-bottom:5px">Consulta automática · SEPA · región Buenos Aires (CENTRO)</div>'+(p.autoItems||[]).map(item=>{
  const d=sepaPrices[item.ean],title='<b>'+esc(item.name)+'</b><div style="font-size:10px;color:#687386">Marca '+esc(item.brand||'')+' · EAN '+esc(item.ean)+'</div>';
  if(!d)return '<div style="padding:9px 0;border-top:1px solid #edf0f4">'+title+'<div class="hint">Sin precio disponible en la consulta.</div></div>';
  const stores=(d.precios||[]).filter(x=>/coto|carrefour/i.test(x.cadena?.nombre||''));
  const rows=stores.map(x=>{const n=x.precio_efectivo??x.precio_lista;return '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #edf0f4"><span>'+esc(x.cadena?.nombre||'Supermercado')+(x.promo?' · promoción':'')+'</span><b>'+(n!=null?money(n):'Sin precio')+'</b></div>'+(item.unit==='500 ml'&&n!=null?'<div style="font-size:10px;color:#687386;text-align:right">'+money(n*2)+' por litro</div>':'')}).join('');
  return '<div style="padding:9px 0;border-top:1px solid #edf0f4">'+title+(rows||'<div class="hint">No hay precio informado para Coto o Carrefour en esta región.</div>')+'<div style="font-size:10px;color:#687386">Fecha del dato: '+esc(d.fecha||'no informada')+'</div></div>';
 }).join('')+'<div class="hint" style="margin:4px -11px -8px">Fuente: SEPA, precios declarados por supermercados. Buenos Aires (CENTRO) no identifica específicamente cada sucursal de San Martín. No incluye descuentos bancarios.</div></div>';
}
function render(){
 document.getElementById('refreshStatus').textContent=refreshMessage;
 document.getElementById('categories').innerHTML=categoriesList.map(c=>'<button class="catbtn '+(c===selectedCategory?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'<span class="catcount">'+products.filter(p=>p.category===c).length+' producto(s)</span></button>').join('');
 document.querySelectorAll('.catbtn').forEach(b=>b.addEventListener('click',()=>{selectedCategory=b.dataset.category;render()}));
 const items=products.filter(p=>p.category===selectedCategory);
 document.getElementById('products').innerHTML=items.length?items.map(p=>'<section class="card"><div class="cardhead"><div><div class="store">'+esc(p.store)+'</div><div class="name">'+esc(p.name)+'</div></div><a class="open" href="'+esc(p.url)+'" target="_blank" rel="noopener">Abrir ↗</a></div>'+(p.autoItems||p.autoPending?renderAuto(p):'<div class="hint">Pendiente de asociar código de barras.</div>')+'</section>').join(''):'<div class="empty">Todavía no hay productos en esta categoría.</div>';
}
async function refreshPrices(){
 render();const key='misPreciosSepaCache';
 try{
  const mr=await fetch(SEPA_BASE+'/manifest.json?open='+Date.now(),{cache:'no-store'});if(!mr.ok)throw Error('SEPA no disponible');
  const manifest=await mr.json(),v=encodeURIComponent(manifest.version_tag||manifest.fecha||Date.now()),date=manifest.fecha||'';
  const pairs=await Promise.all(allEans().map(async e=>{try{const r=await fetch(SEPA_BASE+'/sku/'+e+'/'+SEPA_REGION+'.json?v='+v,{cache:'no-store'});return [e,r.ok?await r.json():null]}catch(_){return [e,null]}}));
  sepaPrices=Object.fromEntries(pairs.filter(x=>x[1]));
  localStorage.setItem(key,JSON.stringify({prices:sepaPrices}));
  const age=date?Math.floor((Date.now()-new Date(date+'T12:00:00-03:00'))/86400000):99;
  refreshMessage='SEPA: '+(date||'fecha no informada')+(age>2?' · datos demorados':' · consultado al abrir');render();
 }catch(e){
  try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.prices){sepaPrices=saved.prices;refreshMessage='Sin conexión · último dato guardado (desactualizado)'}else refreshMessage='No se pudo conectar con SEPA · sin precio actualizado'}catch(_){refreshMessage='No se pudo conectar con SEPA · sin precio actualizado'}
  render();
 }
}
render();refreshPrices();
</script>
</body>
</html>
