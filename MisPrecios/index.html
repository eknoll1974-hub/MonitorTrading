<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>Mis precios</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:#172033;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#172554;color:#fff;padding:12px 14px;box-shadow:0 2px 10px #17255430}
.head{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:18px;margin:0}.sub{font-size:11px;color:#cbd5e1}
main{max-width:850px;margin:auto;padding:10px 9px 30px}
.card{background:#fff;border:1px solid #e0e5ed;border-radius:12px;overflow:hidden;margin-bottom:11px;box-shadow:0 2px 7px #14213d0b}
.cardhead{padding:9px 11px;display:flex;align-items:center;gap:8px;min-height:43px}
.name{font-weight:750;font-size:14px;min-width:0;overflow-wrap:anywhere}.store{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#687386;font-weight:800}
.open{margin-left:auto;white-space:nowrap;color:#2457d6;text-decoration:none;font-size:11px;font-weight:700}
.framewrap{height:620px;background:#fff;border-top:1px solid #e8ebf0;position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.hint{padding:8px 11px;color:#687386;font-size:11px;background:#fafbfc;border-top:1px solid #edf0f4}
footer{text-align:center;color:#8791a1;font-size:10px;padding:8px 12px 20px}
@media(min-width:600px){main{padding:14px}.framewrap{height:720px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Mis precios</h1><div class="sub">Productos abiertos automáticamente</div></div><div class="sub" id="total"></div></div></header>
<main id="products"></main>
<footer>Si un comercio bloquea la visualización integrada, usá “Abrir ↗” para consultar su página.</footer>
<script>
const products=[
 {name:"Bondiola de cerdo x kg",store:"Coto",url:"https://www.coto.com.ar/productos/bondiola-de-cerdo-x-kg-/_/R-00000943-00000943-200"},
 {name:"Bondiola congelada x kg",store:"Carrefour",url:"https://www.carrefour.com.ar/bondiola-congelada-x-kg-691385/p"}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('total').textContent=products.length+' productos';
document.getElementById('products').innerHTML=products.map((p,i)=>`
<section class="card">
 <div class="cardhead">
  <div><div class="store">${esc(p.store)}</div><div class="name">${esc(p.name)}</div></div>
  <a class="open" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir ↗</a>
 </div>
 <div class="framewrap"><iframe src="${esc(p.url)}" title="${esc(p.name)} - ${esc(p.store)}" loading="${i===0?'eager':'lazy'}" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe></div>
 <div class="hint">Si ves un espacio en blanco o un mensaje de bloqueo, este comercio no permite mostrarse dentro de otra página.</div>
</section>`).join('');
</script>
</body>
</html>
